      - release-notes-ps-8.4.5.md
      - release-notes-ps-8.4.4.md
      - release-notes-ps-8.4.3.md
      - release-notes-ps-8.4.2.md
      - release-notes-ps-8.4.1.md
      - release-notes-ps-8.4.md
    - Percona Distribution for MySQL using Percona XtraDB Cluster:
      - release-notes-pxc-8.4.5.md
      - release-notes-pxc-8.4.4.md
      - release-notes-pxc-8.4.3.md
      - release-notes-pxc-8.4.2.md
      - release-notes-pxc-8.4.0.md
  - Discover Percona Distribution for MySQL:
    - components.md
    - deployment-variants.md
  - Install and update:
    - installing.md
    - install-pdps.md
    - install-pdpxc.md
    - minor-upgrade.md
    - downgrade.md
  - Solutions - high availability:
    - Technical overview: pdps-group-replication.md
    - architecture-components.md
    - monitoring.md
    - Deployment: deploy-pdps-group-replication.md
  - Replication manager for Percona XtraDB Cluster:
    - replication-manager-for-pxc.md
    - replication-manager-troubleshooting.md
